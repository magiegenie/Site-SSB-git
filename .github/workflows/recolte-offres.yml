name: Récolte des offres (stage / alternance / CDI)

on:
  schedule:
    - cron: "0 6 * * *" # tous les jours à 6h UTC
  workflow_dispatch: {} # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

jobs:
  recolte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Toutes ces clés sont facultatives : une source sans clé est ignorée,
      # et la couche "sites carrière" fonctionne sans aucune clé.
      - name: Récolter les offres
        env:
          FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
          FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
          LA_BONNE_ALTERNANCE_API_KEY: ${{ secrets.LA_BONNE_ALTERNANCE_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: node outils/recolter-offres.mjs

      - name: Publier si les offres ont changé
        run: |
          if git diff --quiet -- assets/data/offres.json; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/offres.json
          git commit -m "Mise à jour automatique des offres"
          git push
